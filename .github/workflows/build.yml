# This file tells GitHub to build the APK for you every time you push code.
# No computer needed: GitHub's servers do the building.

name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"] # pushing a tag like v1.0.0 also publishes a proper release
  workflow_dispatch: # also lets you press "Run workflow" by hand in the Actions tab

permissions:
  contents: write # needed to publish files on the Releases page

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ---------------------------------------------------------------------------
      # The speech engine (sherpa-onnx). Its Kotlin code is already in this repo
      # (app/src/main/java/com/k2fsa/sherpa/onnx). The compiled native libraries are
      # big binary files, so we download them here instead of storing them in git.
      # The version MUST match the Kotlin code (both are 1.13.8).
      # ---------------------------------------------------------------------------
      - name: Download the speech engine libraries
        run: |
          set -euo pipefail
          V=1.13.8
          curl -fL --retry 3 -o /tmp/sherpa-android.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${V}/sherpa-onnx-v${V}-android.tar.bz2"
          mkdir -p /tmp/sherpa
          tar xjf /tmp/sherpa-android.tar.bz2 -C /tmp/sherpa
          SRC=$(find /tmp/sherpa -type d -name arm64-v8a | head -n 1)
          test -n "$SRC"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp -v "$SRC"/*.so app/src/main/jniLibs/arm64-v8a/
          ls -lh app/src/main/jniLibs/arm64-v8a

      # ---------------------------------------------------------------------------
      # The Japanese speech model. Only runs the very first time: it downloads the
      # official model, keeps just the small files the app needs (about 155 MB) and
      # puts them on your repo's Releases page as "model-v1". The app downloads them
      # from there. If this ever goes wrong, delete the "model-v1" release and tag
      # on GitHub and run this workflow again.
      # ---------------------------------------------------------------------------
      - name: Publish the speech model files (first run only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view model-v1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The model-v1 release already exists, nothing to do."
            exit 0
          fi

          mkdir -p /tmp/model
          cd /tmp/model

          M=sherpa-onnx-zipformer-ja-reazonspeech-2024-08-01
          curl -fL --retry 3 -o model.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/${M}.tar.bz2"
          tar xjf model.tar.bz2
          curl -fL --retry 3 -o silero_vad.onnx \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx"
          ls -lh "$M"

          gh release create model-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "Speech model files (the app downloads these, do not delete)" \
            --notes "Japanese speech recognition model (ReazonSpeech zipformer, int8) and a voice detector, repackaged from the sherpa-onnx project. The app downloads these files the first time you use it." \
            "$M/encoder-epoch-99-avg-1.int8.onnx" \
            "$M/decoder-epoch-99-avg-1.onnx" \
            "$M/joiner-epoch-99-avg-1.int8.onnx" \
            "$M/tokens.txt" \
            "silero_vad.onnx"

      # ---------------------------------------------------------------------------
      # The noise suppression model (GTCRN, about half a megabyte). The step above only
      # runs the first time, so this one adds the file to the existing "model-v1" release
      # if it is missing. It does nothing when the file is already there.
      # ---------------------------------------------------------------------------
      - name: Add the noise suppression model (if missing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          names=$(gh release view model-v1 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          if grep -qx 'gtcrn_simple.onnx' <<< "$names"; then
            echo "gtcrn_simple.onnx is already on the release, nothing to do."
            exit 0
          fi
          curl -fL --retry 3 -o /tmp/gtcrn_simple.onnx \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/speech-enhancement-models/gtcrn_simple.onnx"
          ls -lh /tmp/gtcrn_simple.onnx
          gh release upload model-v1 /tmp/gtcrn_simple.onnx --repo "$GITHUB_REPOSITORY" --clobber

      # ---------------------------------------------------------------------------
      # Optional speech recognizers you can pick in the app's Settings. Each one is put on
      # its own Releases page the first time (this takes a few minutes per model). If one
      # fails, the others and the APK still build; check the step's log for the reason.
      # ---------------------------------------------------------------------------
      - name: Publish optional recognizer - SenseVoice (first run only)
        continue-on-error: true # a problem here must never stop the APK from building
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-asr-model.sh sensevoice

      - name: Publish optional recognizer - Whisper small (first run only)
        continue-on-error: true # a problem here must never stop the APK from building
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-asr-model.sh whisper-small

      - name: Publish optional recognizer - Qwen3-ASR (first run only)
        continue-on-error: true # a problem here must never stop the APK from building
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-asr-model.sh qwen3asr

      - name: Publish optional recognizer - Fun-ASR Nano (first run only)
        continue-on-error: true # a problem here must never stop the APK from building
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-asr-model.sh funasr

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ---------------------------------------------------------------------------
      # Signing. If you saved the four key secrets (see docs/RELEASING.md) the APK is signed with
      # your private release key. Without them it falls back to the dev key (testing only).
      # ---------------------------------------------------------------------------
      - name: Prepare the release key (if the secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release key found, signing with it."
          else
            echo "No release key secret, signing with the dev key (testing only)."
          fi

      - name: Build the release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk JP-Subs.apk
          ls -lh JP-Subs.apk

      # Option A: download from the run page (Actions tab > the run > Artifacts)
      - name: Save the APK as a download
        uses: actions/upload-artifact@v4
        with:
          name: jpsubs-apk
          path: JP-Subs.apk

      # Option B (easier on a phone): a permanent link on the Releases page
      - name: Publish the APK on the Releases page (latest build)
        uses: ncipollo/release-action@v1
        with:
          tag: latest-build
          name: Latest build
          body: "Newest APK, built automatically from the main branch."
          artifacts: JP-Subs.apk
          allowUpdates: true
          replacesArtifacts: true
          prerelease: true

      # Pushing a tag such as v1.0.0 makes a proper, permanent release with notes.
      - name: Publish a versioned release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: JP Subs ${{ github.ref_name }}
          artifacts: JP-Subs.apk
          allowUpdates: true
          replacesArtifacts: true
          generateReleaseNotes: true
          prerelease: false
