# This file tells GitHub to build the APK for you every time you push code.
# No computer needed: GitHub's servers do the building.

name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: # also lets you press "Run workflow" by hand in the Actions tab

permissions:
  contents: write # needed to publish the APK on the Releases page

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the debug APK
        run: gradle assembleDebug --no-daemon

      # Option A: download from the run page (Actions tab > the run > Artifacts)
      - name: Save the APK as a download
        uses: actions/upload-artifact@v4
        with:
          name: jpsubs-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Option B (easier on a phone): a permanent link on the Releases page
      - name: Publish the APK on the Releases page
        uses: ncipollo/release-action@v1
        with:
          tag: latest-build
          name: Latest build
          body: "Newest debug APK, built automatically from the main branch."
          artifacts: app/build/outputs/apk/debug/app-debug.apk
          allowUpdates: true
          replacesArtifacts: true
          prerelease: true
